name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Run pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          uv run --with pytest pytest -q

  wheel-smoke:
    name: Wheel build smoke (cp312)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade build wheel twine
          python -m build --wheel --outdir dist
          python -m twine check dist/*.whl

      - name: Install wheel and import sentinel
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import copy
          from importlib.metadata import version

          import compat_sentinel
          from compat_sentinel import sentinel

          assert compat_sentinel.__version__ == version("compat-sentinel")
          missing = sentinel("MISSING")
          assert repr(missing) == "MISSING"
          assert copy.copy(missing) is missing
          print("compat-sentinel", compat_sentinel.__version__)
          PY
