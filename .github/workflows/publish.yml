# Publish compat-sentinel to PyPI when a GitHub release is published.
# Pure-Python sdist and wheel. PyPI trusted publishing is configured for
# repository owebeeone/compat-sentinel and this workflow file.

name: Publish compat-sentinel to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Run pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run --with pytest pytest -q

  build-dist:
    name: Source distribution and wheel
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate package metadata
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text())
          name = data["project"]["name"]
          version = data["project"]["version"]
          if name != "compat-sentinel":
              raise SystemExit(f"expected package name 'compat-sentinel', got {name!r}")
          print(f"building {name} {version}")
          PY

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --wheel --outdir dist
          python -m twine check dist/*

      - name: Install wheel and import sentinel
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import copy
          from importlib.metadata import version

          import compat_sentinel
          from compat_sentinel import sentinel

          assert compat_sentinel.__version__ == version("compat-sentinel")
          missing = sentinel("MISSING")
          assert repr(missing) == "MISSING"
          assert copy.copy(missing) is missing
          print("compat-sentinel", compat_sentinel.__version__)
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: compat-sentinel-dist
          path: dist/*

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-dist
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/compat-sentinel

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: compat-sentinel-dist
          path: dist

      - name: List distributions
        run: ls -la dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
